server.port=8080
# Chat 配置
spring.ai.openai.base-url=https://maas.qianwenaiapi.com/compatible-mode
spring.ai.openai.api-key=${QWEN_API_KEY}
spring.ai.openai.chat.options.model=qwen3.8-flash

# Embedding 模型
spring.ai.openai.embedding.options.model=text-embedding-v3

#pinecone
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=index2
spring.ai.vectorstore.pinecone.namespace=knowledge

#ES
spring.elasticsearch.uris=http://localhost:9201
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s

#RAG
app.rag.knowledge-path=file:D:/knowledge/*.*

# 日志级别配置
logging.level.org.springframework.ai=DEBUG
# MongoDB 配置
spring.data.mongodb.uri=mongodb://localhost:27017/chat_memory
# MySQL 数据源配置
spring.datasource.url=jdbc:mysql://localhost:3306/medagent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 开启 SQL 日志打印
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
